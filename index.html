<script> const dishNames = [ "可乐鸡翅根","红烧肉","糖醋里脊","红烧带鱼","土豆炖排骨","油焖大虾","水煮肉片","锅包肉","黄焖鸡","烤鸭","四喜丸子","排骨铁锅炖","蒜香蒸排骨","虾仁蒸蛋","西红柿炒鸡蛋","青椒土豆丝","麻辣香锅","红烧茄子","蔬菜鲜虾饼","小炒牛肉","煎牛肉饼","鱼香肉丝","清炒包菜","蚂蚁上树","蒜薹炒肉","干锅花菜","白菜猪肉炖粉条","白灼虾","香菇油菜","黄瓜炒鸡蛋","京酱肉丝","干煸豆角","总督豆腐","蒜黄炒鸡蛋","清炒丝瓜","辣炒花蛤","葱烧豆腐","肉末豆腐","茄子烧豆角","蒜苔炒肉","青椒酿肉","黄瓜拉皮","凉拌菠菜","凉拌苦菊","腌萝卜","炸花生米","凉拌猪头肉","小葱拌豆腐","熏肠","芹菜花生","黄瓜拌油条","麻酱面藕","烙饼","米饭","鸡蛋挂面","面条","小米南瓜粥","饺子","炒馒头","豆角焖面","大米粥","玉米粥","椒盐花卷","小馄饨","牛肉板面","炒饼","麻酱凉皮","炒方便面","炸酱面","油条","豆腐脑","发面火烧","油泼面","椒盐葱花饼","馒头","披萨","煎蛋","酱肉包子","皮蛋瘦肉粥","脆皮糖糕","虾仁蛋炒饭","西红柿鸡蛋汤","白菜鸡蛋豆腐汤","冬瓜丸子汤","肉丸子青菜汤","紫菜蛋花汤","排骨玉米汤","酸辣汤","蛋挞","杨枝甘露","小蛋糕","柠檬水","鲜榨西瓜汁","鲜榨橙汁","火龙果香蕉奶昔","蓝莓香蕉奶昔","炸鸡柳","芒果奶昔","牛油果香蕉奶昔","切切西瓜","烤肠","榴莲","螺蛳粉","烤串烤肉","卤鸭脖","香辣小龙虾","火锅","火鸡面" ]; const categories = ["全部","家常菜","海鲜","凉菜","主食","汤粥","甜品饮品","夜宵"]; const wheelColors = ["#e2574c","#2f9c9c","#d47f22","#3f7fc4","#c14a7d","#4e9e52","#e2574c","#2f9c9c","#d47f22","#3f7fc4","#c14a7d","#4e9e52"]; const recipeDatabase = {
"可乐鸡翅根": { source:"下厨房·高赞家常菜谱", ingredients:["鸡翅根 500克","可乐 330毫升（1罐）","姜片 15克","葱段 20克","生抽 20毫升","老抽 5毫升","料酒 15毫升","熟白芝麻 3克"], steps:["鸡翅根洗净，两面各划两刀便于入味，冷水下锅加姜片、料酒焯水，煮沸撇去浮沫后捞出沥干。","锅中放少许油，下鸡翅根中火煎到两面微黄。","放姜片、葱段炒香，加生抽、老抽翻炒上色，倒入可乐，液面刚好没过鸡翅。","大火烧开后转中小火焖15分钟，开盖加2克盐，大火把汤汁收浓裹匀，撒白芝麻出锅。"]},
"红烧肉": { source:"东方美食·传统技法（炒糖色）", ingredients:["带皮五花肉 600克","冰糖 30克","生抽 20毫升","老抽 8毫升","料酒 20毫升","葱段 20克、姜片15克","八角2个、香叶2片","盐 3克","热水 适量"], steps:["五花肉切成2.5厘米见方的块，冷水下锅加料酒、姜片焯水3分钟，用温水洗净沥干。","锅中放少许油下冰糖，中小火炒到枣红色、起密集小泡，立刻倒入肉块快速翻炒上色。","下葱姜、八角、香叶炒香，烹入料酒，加生抽、老抽炒匀。","加入没过肉块的热水，大火烧开转小火炖50–60分钟至软烂。","开盖加盐，大火把汤汁收浓、油亮裹在肉上即可。"]},
"糖醋里脊": { source:"下厨房·高赞家常菜谱", ingredients:["猪里脊 350克","玉米淀粉 80克","面粉 20克","白糖 40克","米醋 30毫升","番茄酱 20克","鸡蛋 1个（取蛋清）","料酒 10毫升","白芝麻 3克"], steps:["里脊切成0.8厘米粗条，加盐2克、料酒、蛋清抓匀腌15分钟。","淀粉加面粉和适量清水调成能挂住肉条的稠糊，把肉条裹匀。","油温六成热（约170℃）逐条下锅炸定型捞出，升到八成热（约190℃）复炸到金黄酥脆。","另起锅放白糖、米醋、番茄酱、生抽5毫升、清水30毫升，小火熬到浓稠起泡。","倒入炸好的里脊快速翻匀裹汁，撒白芝麻出锅，趁热吃外酥里嫩。"]},
"红烧带鱼": { source:"美食天下·经典菜谱", ingredients:["带鱼 500克","葱 20克、姜10克、蒜4瓣","料酒 15毫升","生抽 20毫升","老抽 5毫升","香醋 10毫升","白糖 8克","面粉 适量"], steps:["带鱼去头尾、内脏和腹内黑膜洗净，切段后加料酒、姜片、盐2克腌15分钟，表面拍一层薄面粉。","锅中油烧热，带鱼下锅中火煎到两面金黄定型，盛出。","锅留底油爆香葱姜蒜，加生抽、老抽、白糖、香醋和半碗热水烧开。","放入带鱼，中小火烧5分钟入味，中途翻面一次，大火收汁撒葱花出锅。"]},
"土豆炖排骨": { source:"下厨房·高赞家常菜谱", ingredients:["排骨 500克","土豆 2个（约400克）","葱姜 适量","八角 2个","生抽 20毫升","老抽 5毫升","料酒 15毫升","冰糖 5克、盐4克"], steps:["排骨冷水下锅加料酒、姜片焯水，煮沸撇沫后捞出用温水洗净。","锅中放少许油爆香葱姜、八角，下排骨炒到表面微黄。","加生抽、老抽、冰糖炒上色，加入没过排骨的热水，大火烧开转小火炖30分钟。","土豆切滚刀块放入，继续炖15分钟到土豆绵软，加盐，大火稍收汁出锅。"]},
"油焖大虾": { source:"东方美食·鲁菜技法", ingredients:["鲜虾 500克","姜丝 15克、葱段20克","番茄酱 15克","生抽 10毫升","白糖 10克","料酒 15毫升","清水 30毫升","盐 2克"], steps:["大虾剪去虾须虾枪，挑出虾线，用厨房纸吸干表面水分。","锅中稍多放油烧热，下虾中火煎，用锅铲轻压虾头挤出虾脑红油，煎到两面变红盛出。","锅留底油爆香姜丝，下番茄酱炒出红油，加生抽、白糖、料酒、清水调成汁。","大虾回锅，盖盖小火焖2分钟，开盖大火收汁到汤汁油亮裹住虾身，撒葱段出锅。"]},
"水煮肉片": { source:"美食作家王刚·川菜技法", ingredients:["猪里脊 350克","黄豆芽 200克","青菜 150克","郫县豆瓣酱 30克","干辣椒 15克、花椒5克","蒜 20克、姜10克","蛋清 1个、淀粉15克","生抽 15毫升、热水800毫升"], steps:["里脊切薄片，加盐、料酒、蛋清、淀粉抓匀上浆，最后封一勺油防粘。","豆芽、青菜沸水焯1分钟捞出，垫在大碗底部。","锅中油下姜蒜、郫县豆瓣酱炒出红油，加生抽、热水烧开煮2分钟，加盐调好咸淡。","保持汤微沸，逐片下入肉片，用筷子轻轻拨散，肉片变白刚熟（约1分钟）就连汤倒入菜碗。","表面撒蒜末、干辣椒段、花椒，浇上约200℃的热油激出香味，撒香菜即可。"]},
"锅包肉": { source:"东方美食·东北老式做法", ingredients:["猪里脊 400克","土豆淀粉 120克","白糖 70克","9度米醋 60毫升","生抽 5毫升","葱丝15克、姜丝10克、蒜片","胡萝卜丝 15克、香菜20克","盐 2克"], steps:["土豆淀粉加水浸泡1小时以上，用前倒掉表层清水并把淀粉抓碎；里脊切成0.3厘米的大薄片，加少许盐抓匀。","肉片放进湿淀粉，加少量清水和15毫升油抓匀，糊呈缓慢流下的状态。","六成油温（约160℃）逐片下锅炸2分钟定型捞出，八成油温（约180℃）复炸30秒到金黄酥脆。","白糖、米醋、生抽、盐1克调成糖醋汁，老式做法不放番茄酱。","锅留底油爆香葱姜蒜、胡萝卜丝，倒入糖醋汁熬到冒密泡，下肉片和香菜，10秒内快速翻匀出锅。"]},
"黄焖鸡": { source:"下厨房·高赞家常菜谱", ingredients:["鸡腿肉 600克","干香菇 6朵","土豆 1个、青椒1个","姜片15克、蒜片","生抽 25毫升","老抽 5毫升","黄豆酱 15克","冰糖8克、盐2克"], steps:["鸡肉剁块，冷水下锅加料酒、姜片焯水，撇沫捞出沥干；香菇泡发，土豆、青椒切块。","锅中油下姜片、蒜片、黄豆酱炒香，放鸡块中火炒干水分、表面微黄。","加生抽、老抽、冰糖炒上色，倒入泡香菇的水和适量热水，没过鸡肉。","大火烧开转小火焖20分钟，下土豆再焖10分钟，最后放青椒和盐，焖2分钟收汁出锅。"]},
"烤鸭": { source:"《中国菜谱》·家庭烤箱版", ingredients:["白条鸭 1只（约1500克）","蜂蜜 30克","白醋 30毫升","料酒 20毫升","温水 30毫升","葱姜（填鸭腔）","甜面酱、黄瓜条、葱丝、薄饼 各适量"], steps:["鸭子洗净沥干，烧一锅开水均匀淋烫鸭皮3遍使皮收紧，再擦干水分。","蜂蜜、白醋、料酒、温水调成脆皮水，趁热在鸭身刷2–3遍，每遍都要刷完晾干。","把鸭子挂在通风处风干6–8小时（过夜最佳），到鸭皮紧绷干爽、不粘手，鸭腔塞入葱姜。","烤箱200℃预热，鸭胸朝上放在烤架上（下方放烤盘接油），烤50–60分钟，中途翻面、最后再刷一层蜂蜜水上色，烤到枣红酥脆。","片下皮带肉，配薄饼、葱丝、黄瓜条、甜面酱卷食。"]},
"四喜丸子": { source:"老饭骨·鲁菜家宴做法", ingredients:["三肥七瘦猪肉馅 500克","荸荠（马蹄）80克","馒头渣 50克（泡水攥干）","鸡蛋 1个","葱姜末 各10克、葱姜花椒水80毫升","淀粉 20克","生抽20毫升、老抽8毫升","盐4克、白胡椒1克、八角2个"], steps:["荸荠拍碎切小丁，馒头泡水后攥干；肉馅加葱姜末、盐、生抽10毫升、料酒、白胡椒、鸡蛋。","葱姜花椒水分3次打进肉馅，每次都搅到吸收，顺一个方向搅打上劲，再放荸荠、馒头渣、淀粉拌匀，反复摔打到倒扣不掉。","双手沾水淀粉，把肉馅团成4个大丸子。","油温七成热下丸子，炸到表面金黄定型捞出。","丸子放大碗加高汤、生抽、老抽、八角，上锅小火蒸40分钟；滗出原汤勾芡，浇在丸子上即可。"]},
"排骨铁锅炖": { source:"下厨房·东北铁锅炖", ingredients:["排骨 600克","甜玉米 1根","土豆 2个","豆角 200克","葱姜、八角2个、桂皮1小块","生抽 25毫升","豆瓣酱 15克","老抽8毫升、冰糖10克、盐4克"], steps:["排骨冷水下锅加料酒焯水撇沫，捞出洗净；玉米切段，土豆切块，豆角去筋。","铁锅中油下葱姜、八角、桂皮、豆瓣酱炒香，放排骨炒到微黄。","加生抽、老抽、冰糖上色，倒入没过排骨的热水，大火烧开转小火炖30分钟。","下玉米、土豆炖10分钟，再下豆角炖10分钟至熟。","加盐调好咸淡，开盖中火收浓汤汁，直接连锅端上桌。"]},
"蒜香蒸排骨": { source:"豆果美食·粤式蒸菜", ingredients:["排骨 500克","蒜末 30克","豆豉 10克","生抽 15毫升","蚝油 10克","淀粉 15克","白糖5克、盐2克","食用油10毫升、红椒粒葱花"], steps:["排骨剁成小块，用清水浸泡20分钟去血水，捞出攥干。","蒜末分两份，一份用热油激成金银蒜，和生蒜、豆豉、生抽、蚝油、白糖、盐、淀粉一起拌入排骨。","加食用油封油，抓匀腌20分钟，平铺在盘中不要堆叠。","水开后上锅，大火蒸18–20分钟到脱骨，出锅撒红椒粒、葱花即可。"]},
"虾仁蒸蛋": { source:"下厨房·高赞家常菜谱", ingredients:["鸡蛋 3个","鲜虾仁 8只（约120克）","温水 约200毫升（蛋液的1.5倍）","生抽 10毫升","香油 3毫升","盐 1克、料酒5毫升","葱花 适量"], steps:["虾仁去虾线，用料酒、少许盐腌5分钟；鸡蛋打散加1克盐。","加入约蛋液1.5倍的温水（35–40℃）轻轻搅匀，过筛2次倒入蒸盘，撇去浮沫。","盖上保鲜膜并扎几个小孔，水开后中小火蒸8分钟到表面刚凝固。","摆上虾仁再蒸3分钟，关火焖2分钟，淋生抽、香油，撒葱花即可。"]},
"西红柿炒鸡蛋": { source:"下厨房·高赞家常菜谱", ingredients:["西红柿 2个（约350克）","鸡蛋 3个","白糖 8克","盐 3克","葱花 10克","食用油 适量"], steps:["西红柿去蒂切滚刀块（可先烫一下去皮）；鸡蛋打散加1克盐。","锅烧热多放些油，蛋液下锅大火快速炒成大块嫩蛋，刚凝固就盛出。","锅留底油下西红柿，中火炒出红汤、炒到出沙，加白糖中和酸味。","鸡蛋回锅翻匀，加剩余盐，撒葱花，大火翻匀10秒出锅。"]},
"青椒土豆丝": { source:"下厨房·高赞家常菜谱", ingredients:["土豆 2个（约400克）","青椒 1个","干辣椒 5个","花椒 2克","白醋 10毫升","盐 3克","蒜片、葱花"], steps:["土豆去皮切成均匀细丝，用清水浸泡并换2次水洗去淀粉，青椒切丝。","锅中油下花椒、干辣椒、蒜片爆香。","下土豆丝大火快炒，沿锅边烹入白醋。","保持大火炒1.5–2分钟，到断生仍带脆感时下青椒丝、盐，快速翻匀立即出锅。"]},
"麻辣香锅": { source:"下厨房·高赞家常菜谱", ingredients:["鲜虾、五花肉、午餐肉 共400克","莲藕、土豆、西蓝花、木耳 共600克","麻辣香锅底料 1袋（约100克）","干辣椒10克、花椒3克","蒜片、香菜、白芝麻","生抽 10毫升"], steps:["各类食材洗净切好，肉类腌一下，蔬菜分别焯水或过油到七八成熟，沥干备用。","锅中油下干辣椒、花椒、蒜片和香锅底料，小火炒出红油和香味。","先下肉类翻匀，再下耐炒的根茎类，最后下叶菜，全程中大火翻炒。","加生抽翻匀入味，出锅撒香菜段和熟白芝麻，趁热吃。"]},
"红烧茄子": { source:"美食天下·经典菜谱", ingredients:["长茄子 2根（约400克）","青椒 1个","西红柿 半个（可选）","蒜 4瓣","生抽15毫升、老抽3毫升","白糖5克、香醋5毫升","淀粉 适量、盐2克"], steps:["茄子切滚刀块，加2克盐腌10分钟杀出水分，挤干后薄薄裹一层淀粉，减少吸油。","用生抽、老抽、白糖、香醋、淀粉5克、清水30毫升调一碗碗汁。","锅中稍多放油，下茄子中火煎到表面金黄变软，盛出。","锅留底油爆香蒜片，下青椒、西红柿炒几下，茄子回锅，淋入碗汁大火翻匀裹亮出锅。"]},
"蔬菜鲜虾饼": { source:"豆果美食·营养早餐", ingredients:["鲜虾仁 200克","胡萝卜 50克","西兰花 80克（或玉米粒）","蛋清 1个","淀粉 15克","盐2克、白胡椒1克","料酒 5毫升"], steps:["虾仁剁成虾泥（保留少许颗粒更有口感），胡萝卜、西兰花焯水后切碎。","虾泥加蛋清、淀粉、盐、白胡椒、料酒，顺一个方向搅打上劲，再拌入蔬菜碎。","双手沾水取虾泥，压成小饼。","平底锅刷油，中小火把虾饼每面煎3分钟，到两面金黄、内部熟透即可。"]},
"小炒牛肉": { source:"美食台·湘菜嫩滑技法", ingredients:["牛里脊 300克","青椒、小米辣 适量","蒜片、姜片","香菜 1把","生抽10毫升、蚝油10克","淀粉10克、料酒10毫升","盐2克、白胡椒、小苏打1克"], steps:["牛肉逆着纹路切薄片，加生抽、料酒、淀粉、小苏打和一勺油抓匀腌15分钟。","用生抽、蚝油、白胡椒、少许水调一碗碗汁。","锅烧到冒烟，宽油大火下牛肉快速滑炒到变色（约30秒）立即盛出。","爆香姜蒜、辣椒，牛肉回锅，淋入碗汁，大火快炒20秒，撒香菜出锅。"]},
"煎牛肉饼": { source:"豆果美食", ingredients:["牛肉馅 300克","洋葱 半个（约80克）","鸡蛋 1个","面包糠 20克","生抽 10毫升","淀粉 10克","盐3克、黑胡椒2克、料酒"], steps:["洋葱切碎，小火炒软晾凉；牛肉馅加鸡蛋、面包糠、洋葱、生抽、盐、黑胡椒、淀粉。","顺一个方向搅打上劲，分成小团按成1.5厘米厚的饼。","平底锅放少许油，中小火把肉饼每面煎3–4分钟。","煎到两面焦香、内部刚熟无血水，可淋少许黑椒汁出锅。"]},
"鱼香肉丝": { source:"东方美食·川菜鱼香味型", ingredients:["猪里脊 300克","水发木耳 50克","胡萝卜 半根、青椒1个","冬笋（莴笋）50克","泡椒（剁辣椒）20克","葱姜蒜末","生抽15毫升、米醋15毫升、白糖15克","淀粉15克、料酒10毫升"], steps:["里脊切丝，加盐、料酒、淀粉抓匀封油；木耳、胡萝卜、青椒、冬笋都切丝并焯水。","用生抽、米醋、白糖、淀粉5克、清水25毫升调鱼香汁，做到酸甜咸平衡。","热锅凉油下肉丝滑散变白，盛出。","底油下泡椒、姜蒜末，小火炒出红油和香味，下配菜丝炒到断生。","肉丝回锅，淋入鱼香汁，大火翻炒裹匀，撒葱花出锅。"]},
"清炒包菜": { source:"下厨房·高赞家常菜谱", ingredients:["包菜（圆白菜）半颗约400克","干辣椒 5个","蒜 3瓣","花椒 2克","生抽 10毫升","香醋 5毫升","盐2克、白糖3克"], steps:["包菜撕成大片，去掉硬梗，洗净后充分沥干，这是不出水的关键。","锅中油下花椒、干辣椒、蒜片爆香。","下包菜大火快炒，沿锅边淋入香醋。","炒到包菜断生略塌、仍带脆感，加生抽、盐、糖快速翻匀出锅。"]},
"蚂蚁上树": { source:"美食天下·经典菜谱", ingredients:["红薯粉丝 1把（约150克）","猪肉末 150克","郫县豆瓣酱 20克","葱姜蒜 适量","生抽15毫升、老抽5毫升","料酒10毫升、白糖3克","葱花"], steps:["红薯粉丝用温水泡软（约15分钟，别泡烂），捞出剪短一些。","锅中油下肉末炒散，炒到变色出油，加豆瓣酱、姜蒜末炒出红油。","烹料酒，加生抽、老抽、白糖和小半碗热水烧开。","下粉丝，用筷子拌炒让粉丝吸满汤汁，中火收到汤汁将干，撒葱花出锅。"]},
"蒜薹炒肉": { source:"下厨房·高赞家常菜谱", ingredients:["蒜薹 300克","猪瘦肉 150克","姜丝","生抽 15毫升","老抽 3毫升","料酒 10毫升","淀粉 8克、盐2克"], steps:["蒜薹去头尾切4厘米段；肉切丝，加生抽、料酒、淀粉抓匀腌10分钟。","锅中油下肉丝滑炒变色，盛出。","底油下蒜薹中火炒到表皮起皱、断生，可淋少许水焖1分钟。","肉丝回锅，加生抽、老抽、盐，大火翻匀入味出锅。"]},
"干锅花菜": { source:"美食天下·湘赣家常菜", ingredients:["花菜 1颗（约500克）","五花肉 100克","干辣椒 8个","蒜片、蒜苗","豆瓣酱 15克","生抽 10毫升","盐2克、白糖3克"], steps:["花菜掰成小朵，用淡盐水泡10分钟洗净，充分沥干，先干煸或少油煎到边缘微焦盛出。","五花肉切薄片，下锅小火煸出油到微卷。","下豆瓣酱、干辣椒、蒜片炒香，再下花菜中大火翻炒。","炒到花菜断生带焦香，加生抽、盐、糖，最后下蒜苗段翻匀，用干锅或砂锅盛装。"]},
"白菜猪肉炖粉条": { source:"下厨房·东北家常菜", ingredients:["大白菜 500克","五花肉 200克","红薯粉条 100克","葱姜、八角1个","生抽 20毫升","老抽 5毫升","料酒 10毫升","盐 3克"], steps:["粉条用温水泡软；五花肉切片，白菜帮和叶分开切大片。","锅中下五花肉片小火煸出油，加葱姜、八角炒香，烹料酒、生抽、老抽。","先下白菜帮炒软，再下白菜叶，炒到塌软出汤。","加适量热水和粉条，中小火炖10–15分钟到粉条透明，加盐调好出锅。"]},
"白灼虾": { source:"豆果美食·粤式白灼", ingredients:["鲜虾 500克","姜 3片、葱2根","料酒 15毫升","生抽 20毫升","蒜末、红椒丝","香醋 10毫升"], steps:["鲜虾剪须、挑虾线洗净；用生抽、蒜末、红椒丝、少许香醋调蘸汁。","锅中加水，放姜片、葱结、料酒，大火烧开。","水滚后下虾，保持大火煮2–3分钟，虾身弯曲变红立即捞出。","迅速过冰水让虾肉紧实弹牙，沥干后配蘸汁食用。"]},
"香菇油菜": { source:"下厨房·高赞家常菜谱", ingredients:["油菜（小棠菜）400克","鲜香菇 150克","蒜 3瓣","蚝油 15克","生抽 10毫升","淀粉5克、盐2克、白糖3克"], steps:["油菜对半剖开洗净，香菇切片；沸水加少许油和盐，把油菜焯30秒捞出摆盘。","锅中油爆香蒜末，下香菇炒软出香。","加蚝油、生抽、白糖和3勺水烧1分钟。","淋水淀粉勾薄芡，把香菇连汁浇在油菜上即可。"]},
"黄瓜炒鸡蛋": { source:"下厨房·高赞家常菜谱", ingredients:["黄瓜 2根","鸡蛋 3个","蒜片","盐 3克","白糖 2克","食用油 适量"], steps:["黄瓜洗净切菱形片，加少许盐腌2分钟；鸡蛋打散加1克盐。","热锅宽油下蛋液，炒成嫩蛋块盛出。","锅留底油爆香蒜片，下黄瓜中火快炒30秒到刚断生。","鸡蛋回锅，加盐、少许糖，大火翻匀立即出锅，保持黄瓜脆嫩。"]},
"京酱肉丝": { source:"东方美食·京菜技法", ingredients:["猪里脊 300克","甜面酱 40克","葱白 2根","豆腐皮（千张）2张","蛋清 1个、淀粉15克","白糖 10克、生抽10毫升","料酒 10毫升、姜"], steps:["里脊切丝，加蛋清、淀粉、料酒抓匀上浆；葱白切细丝铺盘底，豆腐皮切方块蒸软。","甜面酱加白糖、少许清水澥开。","热锅宽油、三四成热下肉丝滑散变白，捞出沥油。","锅留底油下甜面酱，小火炒香出酱色，下肉丝翻匀裹满酱汁。","盛在葱丝上，吃时用豆腐皮卷肉丝和葱丝。"]},
"干煸豆角": { source:"美食天下·川菜家常", ingredients:["四季豆（豆角）400克","猪肉末 100克","芽菜（榨菜）30克","干辣椒 8个、花椒2克","蒜末","生抽10毫升、盐2克、白糖3克"], steps:["豆角去筋掰段，擦干水分；锅中稍多油，中大火把豆角煸到表皮起皱、出现焦斑（虎皮状）盛出。","锅留底油下肉末炒散，加芽菜、干辣椒、花椒、蒜末炒香。","豆角回锅同炒，加生抽、盐、糖调味。","中火煸炒均匀、豆角熟透入味后出锅。"]},
"总督豆腐": { source:"《中国菜谱》·冀菜直隶官府菜", ingredients:["北豆腐（或鸡蛋豆腐）400克","猪肉末 80克","海米（虾籽）15克","干贝 20克（泡发撕丝）","姜蒜末、青蒜20克","泡辣椒/辣酱 15克","生抽15毫升、料酒10毫升","白糖5克、盐、高汤150毫升、水淀粉"], steps:["豆腐切成3厘米块，油温六成热下豆腐炸到表面金黄微硬，捞出沥油。","锅留底油下肉末煸散，加姜蒜末、泡辣椒、辣酱炒出红油。","烹料酒，加生抽、白糖、少许盐，放海米、干贝丝炒香。","加高汤和豆腐，大火烧开转中小火烧3–5分钟入味。","分两次淋水淀粉勾芡，到汤汁浓稠裹住豆腐，撒青蒜末出锅。"]},
"蒜黄炒鸡蛋": { source:"下厨房·高赞家常菜谱", ingredients:["蒜黄 300克","鸡蛋 3个","盐 3克","白糖 2克","姜丝","食用油 适量"], steps:["蒜黄洗净切4厘米段，梗和叶分开；鸡蛋打散加1克盐。","热锅宽油下蛋液炒成嫩蛋块，盛出。","锅留底油下姜丝，先炒蒜黄梗20秒，再下蒜黄叶。","大火快炒到刚塌软，鸡蛋回锅，加盐、糖快速翻匀出锅。"]},
"清炒丝瓜": { source:"下厨房·高赞家常菜谱", ingredients:["丝瓜 2根（约400克）","蒜 3瓣","盐 2克","白糖 2克","食用油 适量"], steps:["丝瓜去皮切滚刀块，快切快炒、避免用铁锅以防发黑；蒜切片。","锅中油爆香蒜片。","下丝瓜大火快炒，加2勺清水。","炒1–2分钟到丝瓜变软透亮，加盐、糖翻匀立即出锅。"]},
"辣炒花蛤": { source:"下厨房·高赞家常菜谱", ingredients:["花蛤 500克","干辣椒 6个、小米辣","葱姜蒜","豆瓣酱 10克","生抽 10毫升","料酒 15毫升","白糖3克、香菜"], steps:["花蛤用淡盐水加几滴香油吐沙2小时，反复搓洗干净。","沸水焯到花蛤刚开口立即捞出，不开口的丢弃，冲洗沥干。","锅中油下葱姜蒜、干辣椒、豆瓣酱炒香。","下花蛤大火爆炒，烹料酒，加生抽、糖快速翻匀，撒香菜出锅，不要久炒以免肉老。"]},
"葱烧豆腐": { source:"东方美食·鲁菜葱烧技法", ingredients:["北豆腐 1块（约400克）","大葱 2根（取葱白）","生抽15毫升、老抽5毫升","蚝油 10克","白糖 5克","高汤（水）150毫升","淀粉、盐"], steps:["豆腐切厚片，用平底锅中火煎到两面金黄定型，盛出。","葱白切5厘米段，锅留底油下葱段，中小火慢煎到微黄、煎出浓郁葱香，这是葱烧关键。","加生抽、老抽、蚝油、白糖和高汤烧开。","下豆腐，中小火烧3分钟让豆腐吸足葱香，淋水淀粉勾薄芡，汤汁裹亮出锅。"]},
"肉末豆腐": { source:"下厨房·高赞家常菜谱", ingredients:["嫩豆腐 1盒（约400克）","猪肉末 150克","葱姜蒜","豆瓣酱 10克（可选）","生抽15毫升、老抽3毫升","淀粉8克、盐2克、白糖3克"], steps:["嫩豆腐切2厘米块，用淡盐水焯1分钟去豆腥，捞出沥干。","锅中油下肉末炒散变色，加姜蒜末、豆瓣酱炒香。","加生抽、老抽、糖和半碗热水烧开。","轻轻推入豆腐，中小火烧3分钟入味，淋水淀粉勾芡，轻推裹汁，撒葱花出锅。"]},
"茄子烧豆角": { source:"下厨房·高赞家常菜谱", ingredients:["长茄子 2根","豆角 250克","蒜 4瓣","生抽15毫升、蚝油10克、老抽3毫升","白糖3克、盐2克","淀粉 5克"], steps:["茄子切条用盐腌10分钟后挤干；豆角去筋掰段，用微波或干煸到变软起皱。","锅中油先下豆角煸出虎皮盛出，再下茄子煎软盛出。","爆香蒜末，下茄子和豆角，加生抽、蚝油、老抽、糖和3勺水。","中火烧2分钟入味，淋薄芡翻匀出锅。"]},
"蒜苔炒肉": { source:"下厨房·高赞家常菜谱", ingredients:["蒜苔 300克","猪瘦肉 150克","姜丝","生抽 15毫升","老抽 3毫升","料酒 10毫升","淀粉8克、盐2克"], steps:["蒜苔切4厘米段，瘦肉切丝，加生抽、料酒、淀粉腌10分钟。","热油下肉丝滑散变色，盛出。","下蒜苔中火翻炒，淋少许水焖1分钟到断生。","肉丝回锅，加老抽、盐大火翻匀出锅。"]},
"青椒酿肉": { source:"下厨房·高赞家常菜谱", ingredients:["青椒 6个","猪肉馅 250克","葱姜水","生抽15毫升、蚝油10克","淀粉 15克","蛋液、蒜片","盐2克、白糖3克"], steps:["肉馅加葱姜水、生抽、蚝油、盐、淀粉、蛋液搅打上劲。","青椒去籽剖成两半（或整只去蒂），内侧拍一层干淀粉，填满肉馅压实。","平底锅放少许油，肉馅一面朝下中小火煎到金黄定型，再翻面把青椒煎出虎皮。","用生抽、糖、半碗水调汁淋入，盖盖焖3分钟，开盖收汁即可。"]},
"黄瓜拉皮": { source:"下厨房·东北凉菜", ingredients:["鲜拉皮（或干粉皮）300克","黄瓜 1根、胡萝卜半根","蒜末、香菜","芝麻酱 30克","生抽15毫升、香醋15毫升","盐2克、糖5克","辣椒油、芥末油（可选）"], steps:["拉皮用凉开水冲散沥干（干粉皮提前用温水泡软），黄瓜、胡萝卜切丝。","芝麻酱用温水澥开，加生抽、香醋、盐、糖、蒜末调成麻酱汁。","盘中黄瓜丝垫底，盖上拉皮，浇麻酱汁。","吃前加辣椒油、香菜拌匀即可。"]},
"凉拌菠菜": { source:"下厨房·高赞家常菜谱", ingredients:["菠菜 400克","花生米 50克（可选）","蒜 3瓣","生抽10毫升、香醋10毫升","盐2克、糖3克、香油5毫升","白芝麻"], steps:["菠菜择洗干净，沸水加少许油和盐焯30秒，捞出过凉水，攥干切段。","花生米小火炒熟晾凉。","用蒜末、生抽、香醋、盐、糖、香油调成汁。","菠菜装盘放花生米，浇汁拌匀，撒白芝麻。"]},
"凉拌苦菊": { source:"豆果美食·爽口凉菜", ingredients:["苦菊 1把（约300克）","蒜末","花生米碎","生抽 10毫升","香醋 15毫升","白糖5克、盐1克、香油5毫升","辣椒油（可选）"], steps:["苦菊摘洗，用淡盐水泡10分钟，凉开水冲净沥干，掐成段。","用生抽、香醋、白糖、盐、香油、蒜末调成酸甜汁。","苦菊装盘，临吃前再淋汁，避免久放塌软。","撒花生米碎，拌匀即食。"]},
"腌萝卜": { source:"下厨房·高赞家常菜谱", ingredients:["白萝卜 1根（约800克）","小米辣、蒜片、姜片","米醋 150毫升","白糖 60克","盐 15克、生抽30毫升","凉白开 适量"], steps:["萝卜洗净切条或切片，加10克盐抓匀腌1小时杀出辛辣水，倒掉并用凉白开冲洗、攥干。","锅中放米醋、白糖、剩余盐、生抽和等量凉白开，加热到糖化后放凉成腌汁。","无水无油的密封罐放萝卜、蒜姜、小米辣，倒入腌汁没过萝卜。","密封冷藏，4小时后可食，隔夜更入味，3天内吃完保持爽脆。"]},
"炸花生米": { source:"美食天下·经典菜谱", ingredients:["花生米 250克","食用油 适量","白酒 3毫升","盐 3克"], steps:["花生米挑去坏粒，用湿抹布擦净，不要水洗，表面必须晾干。","冷锅冷油下花生米，中小火不停翻炒。","炒到花生米变色、听到密集噼啪声、闻到香味就关火，余温会继续加热。","趁热淋几滴白酒翻匀，摊开晾凉后撒盐，凉透才会酥脆。"]},
"凉拌猪头肉": { source:"下厨房·家常凉菜", ingredients:["熟卤猪头肉 300克","黄瓜 1根","蒜末、香菜","生抽 15毫升","香醋 10毫升","辣椒油 10克","白糖3克、盐1克、香油、熟芝麻"], steps:["猪头肉切薄片，黄瓜拍碎或切丝垫底。","用蒜末、生抽、香醋、白糖、盐、香油、辣椒油调汁。","肉片和黄瓜放盆中，淋入料汁。","加香菜段、熟芝麻拌匀装盘。"]},
"小葱拌豆腐": { source:"下厨房·高赞家常菜谱", ingredients:["嫩豆腐（北豆腐）300克","小葱 3根","盐 2克","生抽 5毫升（可选）","香油 8毫升","鸡精 少许"], steps:["豆腐切1.5厘米小丁，沸水加少许盐焯1分钟去豆腥，捞出过凉沥干。","小葱切葱花，葱白葱绿分开放。","豆腐装盘，撒葱花、盐、少许鸡精。","淋香油（可加少许生抽），吃时轻轻拌匀。"]},
"熏肠": { source:"下厨房·熟食家常处理", ingredients:["熟熏肠（红肠）300克","食用油 少许","蒜片（可选）"], steps:["熏肠本身是熟制成品，家常做法以加热煎香为主，无需复杂调味。","剥去外衣，斜切成0.5厘米片（整根上锅蒸10分钟加热也可）。","平底锅刷薄油，中小火把肠片下锅。","每面煎1–2分钟到边缘微卷、出油焦香，可配蒜片同食，也可夹饼、配面。"]},
"芹菜花生": { source:"豆果美食·爽口小菜", ingredients:["花生米 200克","芹菜 200克","胡萝卜 半根","花椒、八角1个","盐 4克","香油 5毫升","鸡精 少许"], steps:["花生米提前泡2小时，冷水下锅加八角、花椒、2克盐煮15分钟，到熟而带脆，捞出晾凉。","芹菜去筋切小丁，胡萝卜切丁，沸水焯1分钟捞出过凉沥干。","三样放盆中，加盐、鸡精。","可炸点花椒油趁热激香，最后淋香油拌匀。"]},
"黄瓜拌油条": { source:"下厨房·山东凉菜", ingredients:["油条 2根","黄瓜 2根","蒜末、香菜","芝麻酱 20克","生抽10毫升、香醋10毫升","盐1克、糖3克","辣椒油（可选）"], steps:["油条掰成3厘米段，可低温烘1分钟回脆；黄瓜拍碎切块。","芝麻酱澥开，加蒜末、生抽、香醋、盐、糖调成汁。","黄瓜装盘垫底，上桌前再撒油条段，避免泡软。","淋麻酱汁、辣椒油，撒香菜，现拌现吃保持油条酥脆。"]},
"麻酱面藕": { source:"下厨房·高赞家常菜谱", ingredients:["干面藕 150克","黄瓜 1根、香菜","芝麻酱 40克","蒜末 15克、辣椒面5克、白芝麻5克","生抽20毫升、陈醋15毫升","盐2克、白糖5克","热油 20毫升"], steps:["干面藕用温水泡30–60分钟，到完全变软、捏开无硬心，反复攥干水分。","蒜末、辣椒面、白芝麻放碗里浇热油激香；芝麻酱用温水澥成酸奶状。","碗中加生抽、陈醋、盐、糖和澥好的芝麻酱搅匀成料汁。","面藕加黄瓜丝、香菜，倒入料汁抓拌均匀，让面藕吸满料汁即可。"]},
"烙饼": { source:"下厨房·家常面饼", ingredients:["中筋面粉 500克","温水 300毫升（约40℃）","盐 3克","食用油、油酥","葱花、花椒粉（葱油饼用）"], steps:["面粉加盐，分次加温水拌成絮状，揉成光滑面团，盖湿布醒30分钟。","面团分剂擀开，刷一层油酥（油拌面粉），撒盐或葱花，卷起盘成圆饼再擀薄。","平底锅中小火，饼坯下锅，盖上盖子烙。","一面烙到金黄起泡翻面，两面金黄后用锅铲从边缘向中间怼松层次，出锅。"]},
"米饭": { source:"中国烹饪协会教材·基础主食", ingredients:["大米 300克","清水 360毫升（米水比1:1.2）"], steps:["大米淘洗2遍即可，不要反复揉搓，然后沥水。","按米水比1:1.2加水（新米减20毫升、陈米加20毫升），浸泡20分钟。","电饭煲启动煮饭；普通锅先大火煮开，再转最小火焖12分钟。","关火后继续焖10分钟，用饭勺翻松、散去多余水汽。"]},
"鸡蛋挂面": { source:"下厨房·快手汤面", ingredients:["挂面 200克","鸡蛋 2个","青菜","葱花","生抽 15毫升","香油5毫升、盐3克","猪油5克（提香，可选）"], steps:["碗中放生抽、猪油、葱花、盐，冲入半碗煮面热汤做成汤底。","锅中水烧开，下挂面煮到将熟。","另起锅把鸡蛋卧成荷包蛋（或先煎一个蛋）。","青菜烫熟，把面、蛋、菜捞入碗中，淋香油即可。"]},
"面条": { source:"美食天下·基础阳春面", ingredients:["鲜面条（挂面）300克","葱花","生抽 15毫升","香醋5毫升、香油5毫升","猪油 5克","盐 2克、青菜"], steps:["碗底放猪油、生抽、香醋、盐、葱花。","舀两勺滚烫的面汤冲入碗中，把猪油和葱花冲香做成汤底。","锅中宽水烧开下面，挂面约煮5分钟、鲜面约3分钟，煮到适口。","面条捞入汤碗，烫几棵青菜铺上即可。"]},
"小米南瓜粥": { source:"下厨房·高赞家常菜谱", ingredients:["小米 100克","南瓜 250克","清水 1200毫升"], steps:["小米淘洗后浸泡20分钟；南瓜去皮去瓤切小块。","锅中加水烧开后下小米，大火煮开转小火。","熬15分钟后下南瓜块，继续小火熬20分钟，期间搅动几次防粘。","熬到小米开花、南瓜融化、粥体浓稠即可，南瓜本身有甜味，一般不用加糖。"]},
"饺子": { source:"下厨房·高赞家常菜谱", ingredients:["饺子 30个（2–3人份）","清水 足量","醋、蒜末（蘸汁）"], steps:["锅中加足量水（不少于2500毫升）大火烧开，水要宽。","水沸下饺子，用勺背沿锅边轻推，防止粘底。","再次沸腾点一碗冷水，如此重复2–3次（肉馅点3次、素馅点2次）。","饺子全部鼓起浮面、饺子皮透亮，再煮1分钟捞出，配醋蒜汁。"]},
"炒馒头": { source:"豆果美食·快手主食", ingredients:["凉馒头 2个","鸡蛋 2个","盐 2克","椒盐（孜然粉）","葱花","火腿肠丁、青豆（可选）"], steps:["馒头切1.5厘米丁；鸡蛋打散加1克盐，把馒头丁倒入蛋液中裹匀。","平底锅多放些油，下馒头丁中小火翻炒。","炒到每面金黄酥脆、粒粒分明。","可下火腿丁、青豆同炒，撒椒盐和葱花翻匀出锅。"]},
"豆角焖面": { source:"下厨房·山西/河南焖面", ingredients:["鲜面条（细蒸面）400克","豆角 250克","五花肉 100克","蒜片、葱姜","生抽20毫升、老抽8毫升","料酒10毫升、盐3克","香醋 5毫升"], steps:["豆角去筋掰段，五花肉切片；面条可先蒸8分钟到半熟，抖散拌少许油防粘。","锅中下肉片煸出油，加葱姜、豆角翻炒变色，加生抽、老抽、料酒、盐和没过菜的热水。","盛出半碗汤汁备用，把面条松散铺在菜上，盖盖中小火焖8分钟。","汤汁快干时沿边淋回预留汤汁，再焖2分钟，加蒜片、香醋，用筷子挑拌均匀出锅。"]},
"大米粥": { source:"下厨房·绵白粥做法", ingredients:["大米 100克","清水 1000–1200毫升","食用油 几滴（可选）"], steps:["大米淘洗后浸泡20–30分钟（提前冷冻一晚更容易煮开花）。","水烧开下米，大火煮滚搅几下防粘。","转最小火、半盖锅盖熬30–40分钟，每10分钟搅一次。","熬到米粒开花、米汤浓稠挂勺，喜欢绵密可多搅几下出锅。"]},
"玉米粥": { source:"豆果美食", ingredients:["细玉米面 80克","清水 1000毫升"], steps:["玉米面先用少量凉水搅成无颗粒的稀糊，防止下锅结块。","锅中水烧开，把玉米糊边搅边缓缓倒入。","大火煮开后转小火，并不停搅拌。","熬5–8分钟到粥面泛油光、浓稠顺滑即可。"]},
"椒盐花卷": { source:"下厨房·发面主食", ingredients:["中筋面粉 500克","温水 260毫升","干酵母 5克","白糖10克、盐3克","椒盐、食用油","葱花（可选）"], steps:["温水化开酵母和糖，倒入面粉揉成光滑面团，28℃发酵到2倍大（约1小时）。","排气擀成长方形薄片，刷油，均匀撒椒盐（和葱花）。","折叠切条，两三条叠起用筷子压纹、拧成花卷。","二次醒发15分钟，水开后中火蒸12分钟，关火焖3分钟再开盖。"]},
"小馄饨": { source:"美食天下·鲜汤小馄饨", ingredients:["小馄饨皮 30张","猪肉馅 200克","葱姜水","虾皮、紫菜、葱花","生抽、香油","盐、白胡椒"], steps:["肉馅加葱姜水、盐、生抽、香油，顺一个方向搅打上劲。","取一张小皮放少许馅，对角收拢捏成小馄饨。","碗中放虾皮、紫菜、葱花、生抽、香油、白胡椒，冲入热高汤。","水沸下馄饨，煮到全部浮起、皮透亮即捞入汤碗。"]},
"牛肉板面": { source:"厨师之家·安徽太和板面", ingredients:["宽板面（鲜宽面）300克","牛瘦肉 200克","牛油（或食用油）","干辣椒15克（提前泡软）","郫县豆瓣15克","八角、桂皮、香叶、草果、小茴香、白芷","葱姜洋葱","生抽20毫升、老抽8毫升、盐、青菜、卤蛋"], steps:["牛肉切小丁；锅中油先下葱姜、洋葱、香菜炸到焦黄捞出。","转小火下八角、桂皮、香叶、草果、小茴香、白芷炸香，再下泡软的干辣椒炒出香味。","下牛肉丁煸干，加豆瓣酱炒出红油，烹生抽、老抽，加热水没过，小火炖40分钟成牛肉卤子，加盐。","另起锅宽水煮熟宽面和青菜，捞入碗中浇一勺面汤。","浇上牛肉卤子和辣椒卤油，配卤蛋拌匀食用。"]},
"炒饼": { source:"下厨房·北方炒饼丝", ingredients:["烙饼（剩饼）300克","圆白菜 150克","肉丝 100克","蒜片、葱姜","生抽15毫升、老抽5毫升","香醋 8毫升、盐2克"], steps:["饼切细丝，圆白菜切丝，肉丝用生抽、淀粉腌一下。","锅中油下肉丝滑散，加葱姜、圆白菜丝大火炒到断生。","加生抽、老抽、盐和少许水，把饼丝松散铺在菜上，盖盖小火焖2分钟。","开盖加蒜片，沿锅边淋醋，用筷子挑炒均匀、饼丝热透出锅。"]},
"麻酱凉皮": { source:"下厨房·陕西凉皮", ingredients:["凉皮 2张（约350克）","黄瓜 1根、绿豆芽","面筋（可选）","芝麻酱 40克","蒜水、生抽15毫升、香醋15毫升","盐2克、糖3克","辣椒油"], steps:["凉皮切宽条；绿豆芽焯水过凉，黄瓜切丝。","芝麻酱用凉白开澥成流泻状，加蒜水、生抽、香醋、盐、糖调成麻酱汁。","碗中放凉皮、面筋、豆芽、黄瓜丝。","浇麻酱汁和油泼辣子，吃时拌匀。"]},
"炒方便面": { source:"豆果美食·夜宵快手", ingredients:["方便面 2包","鸡蛋 2个","火腿肠、青菜、洋葱","生抽10毫升、老抽5毫升","方便面调料 半包","香醋（可选）"], steps:["方便面煮到刚散开（约1分钟，别煮软），立即捞出过凉、沥干，拌少许油防粘。","鸡蛋炒熟盛出；火腿肠、洋葱切片，青菜洗净。","锅中油爆香洋葱，下青菜、火腿翻炒，再下方便面。","加生抽、老抽和半包调料粉，大火用筷子挑炒均匀，鸡蛋回锅翻匀出锅。"]},
"炸酱面": { source:"东方美食·老北京小碗干炸", ingredients:["手擀面（挂面）350克","猪肉末（肥三瘦七）250克","干黄酱 40克","甜面酱 30克","葱姜末","黄瓜丝、萝卜丝、豆芽、青豆（面码）","白糖5克、料酒"], steps:["干黄酱和甜面酱按比例加少许清水澥开。","锅中多放油下肉末，中小火煸到出油酥香，加葱姜末、料酒。","倒入澥好的酱，小火不停翻炒15–20分钟，到酱色油亮、酱肉分离，加糖提鲜。","面条煮熟过水捞入碗，浇上炸肉酱。","铺上黄瓜丝等各色面码，拌匀食用。"]},
"油条": { source:"下厨房·蓬松油条", ingredients:["中筋面粉 500克","温水 300毫升","鸡蛋 1个","干酵母5克（或泡打粉8克）","盐6克、小苏打2克","和面油15毫升"], steps:["面粉加酵母、盐、小苏打、鸡蛋，分次加温水揉成软面团，抹油盖好冷藏发酵过夜。","面团回温后不要揉，擀成0.5厘米厚的长条，切成2厘米宽的小条，两条叠起用筷子在中间压痕。","油温七成热（约200℃），捏住两头轻轻抻长下锅。","不断翻动，炸到金黄蓬松膨大，捞出沥油，趁热配豆浆。"]},
"豆腐脑": { source:"美食天下·咸卤豆腐脑", ingredients:["内脂豆腐（嫩豆腐）1盒","干木耳15克、黄花菜15克、香菇","鸡蛋 1个","生抽 15毫升","淀粉 20克","盐、虾皮、香菜、辣椒油"], steps:["木耳、黄花菜泡发切丝，香菇切丁；嫩豆腐整盒隔水蒸8分钟。","锅中加高汤或水600毫升，下木耳、黄花菜、香菇煮5分钟，加生抽、盐。","鸡蛋打散淋成蛋花，用淀粉20克加水40毫升的水淀粉分次勾稠成卤。","嫩豆腐舀入碗，浇上卤汁，加虾皮、香菜、辣椒油即可。"]},
"发面火烧": { source:"下厨房·发面烧饼", ingredients:["中筋面粉 500克","温水 280毫升","酵母 5克","盐3克、椒盐（五香粉）","油酥（面粉20克+热油30毫升）","白芝麻"], steps:["酵母用温水化开，加面粉、盐揉成光滑面团，发酵到2倍大。","排气擀片，抹油酥、撒椒盐，卷起分剂，做成圆饼，表面刷水蘸上白芝麻。","二次醒发15分钟。","平底锅小火烙到两面定型微黄，再入烤箱180℃烤10分钟（或锅中小火盖盖烙熟），到外脆内软。"]},
"油泼面": { source:"下厨房·陕西油泼面", ingredients:["宽面（扯面/刀削面）300克","青菜","蒜末20克、葱花","辣椒面 10克、白芝麻","生抽20毫升、香醋15毫升","盐2克","滚烫热油 30毫升"], steps:["宽面煮熟，最后烫几棵青菜，一起捞入大碗，留少许面汤。","面上放蒜末、葱花、辣椒面、白芝麻、盐。","生抽、香醋沿碗边淋入。","油温烧到冒烟（约220℃），均匀泼在辣椒面和蒜末上激出香味，趁热拌匀。"]},
"椒盐葱花饼": { source:"下厨房·半烫面葱油饼", ingredients:["中筋面粉 500克","热水200毫升+凉水80毫升","盐 3克","小葱花 100克","椒盐、食用油"], steps:["面粉加盐，先加热水拌絮再淋凉水，揉成软面团醒30分钟。","分剂擀薄，刷油，撒椒盐和大量葱花，卷起盘圆再擀薄。","平底锅刷油，中小火下饼，盖上盖烙。","两面烙到金黄酥脆，出锅前抖散层次，切块食用。"]},
"馒头": { source:"中国烹饪协会教材·基础发面", ingredients:["中筋面粉 500克","温水 250毫升","干酵母 5克","白糖 10克"], steps:["35℃温水化开酵母和糖，倒入面粉揉成手光、盆光、面光的光滑面团。","28℃发酵到2倍大，内部呈蜂窝状。","充分排气揉成长条，分剂揉成光滑圆馒头，二次醒发15分钟到轻压能回弹。","水开上锅，中火蒸15分钟，关火焖3分钟再开盖，防止回缩。"]},
"披萨": { source:"下厨房·家庭烘焙", ingredients:["披萨饼底 2个（6–8寸）","马苏里拉芝士 150克","披萨酱（番茄酱）40克","培根/火腿/虾仁","青红椒、洋葱、玉米粒","橄榄油"], steps:["饼底抹一层披萨酱，撒第一层芝士。","均匀铺肉类和蔬菜配料，水分大的食材要先焯或炒干。","表面再铺满马苏里拉芝士。","烤箱200℃预热，中层烤12–15分钟，到芝士融化、边缘金黄、出现焦斑即可。"]},
"煎蛋": { source:"下厨房·高赞家常菜谱", ingredients:["鸡蛋 2个","食用油 10毫升","盐 1克","清水 10毫升（嫩口）","黑胡椒 少许"], steps:["平底锅中小火预热，刷一层油。","鸡蛋打入，保持中小火，蛋白开始凝固时沿边淋10毫升清水。","加盖焖1–2分钟：溏心蛋煎到蛋白凝固、蛋黄流动，全熟则多焖1分钟。","撒盐和黑胡椒，轻轻铲出。"]},
"酱肉包子": { source:"下厨房·酱肉包", ingredients:["中筋面粉 500克","温水 260毫升、酵母5克","酱肉丁（猪肉馅）300克","甜面酱20克、黄豆酱10克","葱姜、生抽、白糖、料酒"], steps:["酵母用温水化开和面，发酵到2倍大；肉馅加甜面酱、黄豆酱、生抽、糖、料酒、葱姜炒熟成酱肉馅，放凉。","发面排气分剂，擀成中间厚、边缘薄的包子皮。","包入酱肉馅捏褶收口，二次醒发15分钟。","水开上锅，大火蒸12–15分钟，关火焖3分钟再开盖。"]},
"皮蛋瘦肉粥": { source:"豆果美食·粤式粥品", ingredients:["大米 100克","皮蛋 2个","瘦猪肉 150克","姜丝、葱花","盐、白胡椒","淀粉5克、料酒","香油"], steps:["大米淘洗后加少许油、盐腌15分钟，按米水1:10加水，大火煮开转小火熬30分钟成绵粥。","瘦肉切薄片，用盐、淀粉、料酒腌10分钟；皮蛋切小块。","粥熬稠后先下一半皮蛋和姜丝煮5分钟，再下肉片拨散煮3分钟。","下剩余皮蛋，加盐、白胡椒调味，出锅撒葱花、淋香油。"]},
"脆皮糖糕": { source:"美食天下·河南炸糖糕", ingredients:["普通面粉 300克","开水 600毫升（水面约2:1）","烫面用白糖20克、油20毫升","糖馅：白糖100克","糖馅：熟面粉30克、熟芝麻15克"], steps:["锅中加水600毫升、糖20克、油20毫升烧开，转最小火倒入300克面粉，快速搅到无干粉、面团细腻不粘锅，盖盖焖5分钟。","烫面摊开切块晾到不烫手，加少许干面粉和熟油揉匀，醒20分钟。","白糖、熟面粉、芝麻拌成糖馅，掺熟面粉可防止流糖烫口。","面团分剂捏成小碗，包入糖馅，用虎口收紧口，按成小饼。","六成油温（筷子周围冒密集小泡）下锅，小火炸到鼓起、两面金黄，捞出沥油。"]},
"虾仁蛋炒饭": { source:"下厨房·高赞家常菜谱", ingredients:["隔夜米饭 2碗（约300克）","鸡蛋 2个","鲜虾仁 100克","青豆、胡萝卜、玉米粒共80克","葱花","生抽10毫升、盐2克","白胡椒、料酒"], steps:["虾仁去虾线，用料酒、盐腌5分钟；鸡蛋打散，隔夜米饭提前打散。","虾仁滑炒变色盛出，鸡蛋下锅炒散。","下杂蔬粒炒断生，倒入米饭大火翻炒到粒粒分明、在锅中跳动。","虾仁回锅，加生抽、盐、白胡椒，最后撒大量葱花翻匀出锅。"]},
"西红柿鸡蛋汤": { source:"下厨房·高赞家常菜谱", ingredients:["西红柿 2个","鸡蛋 2个","葱花","盐 3克","淀粉 10克（可选）","白胡椒、香油、香菜"], steps:["西红柿去皮切小块，鸡蛋打散。","锅中放少许油下西红柿炒出红汤出沙，加清水800毫升烧开煮2分钟。","喜欢浓稠可勾薄芡；转小火，把蛋液沿筷子或锅边细细淋入形成蛋花。","蛋花浮起后加盐、白胡椒，关火撒葱花、香菜，淋香油。"]},
"白菜鸡蛋豆腐汤": { source:"豆果美食", ingredients:["大白菜叶 3片","嫩豆腐 半盒","鸡蛋 2个","葱花、姜丝","盐 3克","白胡椒、香油"], steps:["白菜切丝，豆腐切小条，鸡蛋打散。","锅中放少许油炒香姜丝，下白菜丝炒软，加清水800毫升烧开。","下豆腐煮2分钟，转小火淋入蛋液成蛋花。","加盐、白胡椒，关火撒葱花、淋香油。"]},
"冬瓜丸子汤": { source:"下厨房·高赞家常菜谱", ingredients:["冬瓜 300克","猪肉馅 250克","蛋清 1个","葱姜水 60毫升","淀粉 10克","盐4克、白胡椒","香菜、香油"], steps:["肉馅加蛋清、葱姜水（分次打入）、淀粉、盐2克，顺一个方向搅打上劲。","冬瓜去皮切薄片。","锅中水烧到将开未开、锅底冒小泡时转小火，用虎口挤丸子、勺子舀入水中。","丸子浮起后下冬瓜片，中火煮到冬瓜透明，加盐、白胡椒，撒香菜、淋香油。"]},
"肉丸子青菜汤": { source:"下厨房·家常汤品", ingredients:["猪肉馅 250克","小青菜（小白菜）200克","蛋清 1个","葱姜水、淀粉10克","盐4克、白胡椒","姜丝、香油"], steps:["肉馅加蛋清、葱姜水、淀粉、盐搅打上劲。","清水烧到将开未开时转小火，挤入肉丸子，小火浸煮到浮起撇沫。","下姜丝煮3分钟到丸子熟透。","下青菜煮软，加盐、白胡椒，淋香油出锅。"]},
"紫菜蛋花汤": { source:"下厨房·快手汤", ingredients:["紫菜 5克","鸡蛋 2个","葱花、虾皮","盐 3克","白胡椒、香油","生抽 5毫升"], steps:["紫菜撕碎放碗中，加虾皮；鸡蛋打散。","锅中加清水700毫升烧开，加少许生抽。","转小火，蛋液沿锅边画圈淋入，形成漂亮蛋花。","冲入放紫菜的碗中（或下紫菜煮10秒），加盐、白胡椒、葱花、香油。"]},
"排骨玉米汤": { source:"下厨房·清炖汤品", ingredients:["排骨 500克","甜玉米 2根","胡萝卜 1根","姜片、葱段","盐 4克","白胡椒、料酒"], steps:["排骨冷水下锅加料酒、姜片焯水，煮沸撇沫，用温水洗净。","砂锅放排骨、姜片、葱结，加足量热水，大火烧开转最小火炖40分钟。","玉米切段、胡萝卜切块放入，继续炖20分钟到汤甜肉烂。","出锅前加盐、白胡椒，清炖不放酱油，保持汤色清亮。"]},
"酸辣汤": { source:"东方美食·酸辣味型", ingredients:["嫩豆腐 半盒","水发木耳、火腿（熟肉丝）","冬笋丝","鸡蛋 1个","香醋 25毫升、白胡椒3克","生抽15毫升、淀粉20克","香油、葱花"], steps:["豆腐、木耳、火腿、冬笋都切细丝，鸡蛋打散。","锅中加高汤或清水800毫升烧开，下所有丝料煮2分钟，加生抽。","水淀粉勾稠到汤能挂勺，转小火淋入蛋液成蛋花。","关火后再加香醋、白胡椒，醋最后放才能保住酸香，淋香油、撒葱花。"]},
"蛋挞": { source:"下厨房·家庭烘焙", ingredients:["蛋挞皮 12个","鸡蛋 2个","牛奶 200毫升","淡奶油 100毫升","白糖 35克"], steps:["牛奶、淡奶油、糖加热搅到糖化后放凉，加入蛋液轻轻搅匀，避免打起泡。","挞液过筛2次，静置消泡。","蛋挞皮摆入烤盘，挞液倒到八分满。","烤箱200℃预热，中层烤20–25分钟，表面出现焦糖斑点即可。"]},
"杨枝甘露": { source:"下厨房·港式甜品", ingredients:["芒果 2个（约400克）","西柚 半个","西米 80克","椰浆 150毫升","牛奶 100毫升","糖 20克"], steps:["水开下西米，中火煮15分钟，关火焖10分钟到无白芯，过凉水沥干。","芒果取肉，三分之二的芒果肉加椰浆、牛奶、糖用料理机打成芒果浆。","剩余芒果切小丁，西柚撕成颗粒。","杯中放西米、芒果浆，加芒果丁和西柚，冷藏30分钟口感最佳。"]},
"小蛋糕": { source:"下厨房·戚风纸杯蛋糕", ingredients:["低筋面粉 90克","鸡蛋 4个","牛奶 60毫升","玉米油 50毫升","白糖 60克","柠檬汁 几滴"], steps:["蛋黄加牛奶、玉米油搅匀，筛入低粉拌成蛋黄糊；蛋白加柠檬汁分3次加糖，打发到硬性发泡。","取三分之一蛋白霜与蛋黄糊翻拌均匀，再倒回蛋白霜翻拌，不要画圈以免消泡。","面糊装入纸杯到八分满，震出大气泡。","烤箱150℃预热，中层烤30–35分钟，出炉晾凉。"]},
"柠檬水": { source:"豆果美食·健康饮品", ingredients:["柠檬 2个","蜂蜜（白糖）20克","凉白开 800毫升","冰块、盐少许"], steps:["柠檬用盐搓洗表皮蜡质，清水冲净，切薄片并去籽，去籽可避免发苦。","取几片柠檬捣出汁，留几片装饰。","用40℃以下的温水或凉白开冲泡，热水会发苦并破坏维C。","加蜂蜜搅匀，冷藏或加冰块饮用。"]},
"鲜榨西瓜汁": { source:"下厨房·鲜榨饮品", ingredients:["西瓜 500克（净果肉）","冰块（凉白开）","柠檬汁几滴（可选）","蜂蜜（可选）"], steps:["西瓜去籽、去皮切小块。","放入破壁机或榨汁机，可加几块冰。","高速搅打30–45秒，西瓜水分足，一般不用再加水。","可过滤后饮用，滴几滴柠檬汁增鲜，现榨现喝。"]},
"鲜榨橙汁": { source:"豆果美食·鲜榨饮品", ingredients:["鲜橙 3–4个（约500克果肉）","凉白开 100毫升（可选）","蜂蜜、冰块（可选）"], steps:["橙子对半切开，用榨汁机取汁，或去皮去籽取果肉。","果肉放料理机加少量凉白开打细。","喜欢细腻口感可过滤掉果渣。","加冰块或冷藏后立即饮用。"]},
"火龙果香蕉奶昔": { source:"豆果美食·奶昔", ingredients:["红心火龙果 半个","香蕉 1根","酸奶（牛奶）250毫升","蜂蜜 10克"], steps:["火龙果去皮取肉，香蕉剥皮掰段，提前冷冻30分钟口感更绵密。","水果放入料理机，倒入酸奶或牛奶。","高速搅打45秒到顺滑。","按口味加蜂蜜，倒杯立即饮用。"]},
"蓝莓香蕉奶昔": { source:"豆果美食·奶昔", ingredients:["蓝莓 120克","香蕉 1根","酸奶（牛奶）250毫升","蜂蜜 10克"], steps:["蓝莓用淡盐水浸泡洗净，香蕉掰段。","全部放入料理机，加酸奶或牛奶。","高速搅打到细腻顺滑、呈淡紫色。","加蜂蜜调味，倒杯点缀几颗蓝莓即可。"]},
"炸鸡柳": { source:"下厨房·香酥小吃", ingredients:["鸡胸肉 300克","面包糠 80克","鸡蛋 1个","淀粉（面粉）30克","生抽10毫升、料酒10毫升","盐2克、白胡椒、姜","孜然（椒盐）"], steps:["鸡胸切1厘米粗条，加生抽、料酒、盐、白胡椒、姜丝腌20分钟。","依次裹一层淀粉、一层全蛋液、一层面包糠，用手攥紧。","油温六成热（约170℃）下鸡柳，中小火炸2–3分钟定型微黄捞出。","升温八成热复炸30秒到金黄酥脆，捞出沥油，撒孜然、椒盐。"]},
"芒果奶昔": { source:"豆果美食·奶昔", ingredients:["芒果 2个（约300克果肉）","牛奶（酸奶）250毫升","蜂蜜 10克"], steps:["芒果贴核切开取肉切块，冷藏30分钟。","芒果肉和牛奶或酸奶放入料理机。","高速搅打45秒到顺滑浓稠。","按口味加蜂蜜，倒杯点缀芒果粒即可。"]},

"切切西瓜": { source:"下厨房·水果处理", ingredients:["西瓜 适量"], steps:["切之前先用流水把西瓜外皮冲洗干净，避免刀把表面脏污带入果肉。","对半切开，再切成月牙瓣，或十字花切成小块。","用刀沿皮片下瓜肉、去籽，切成方便入口的块。","装碗冷藏15分钟口感更冰爽，现切现吃。"]},

"榴莲": { source:"下厨房·水果处理", ingredients:["榴莲 适量"], steps:["挑选果刺靠拢、底部有裂缝、闻着香浓的成熟榴莲。","从底部裂缝处用力掰开，沿纹路一瓣瓣打开。","取出果肉，去掉大核。","果肉直接食用，冷藏后口感如冰淇淋，一次不宜多吃。"]},

late(${(sx - slot.ax).toFixed(2)} ${(sy - slot.ay).toFixed(2)})`); }); } function easeSpline(x1, y1, x2, y2) { const cx = (t) => ((1 - 3 * x2 + 3 * x1) * t + (3 * x2 - 6 * x1)) * t * t + 3 * x1 * t; const cy = (t) => ((1 - 3 * y2 + 3 * y1) * t + (3 * y2 - 6 * y1)) * t * t + 3 * y1 * t; const dx = (t) => 3 * (1 - 3 * x2 + 3 * x1) * t * t + 2 * (3 * x2 - 6 * x1) * t + 3 * x1; return (x) => { let t = x; for (let i = 0; i < 8; i += 1) { const slope = dx(t); if (Math.abs(slope) < 1e-6) break; const diff = cx(t) - x; if (Math.abs(diff) < 1e-5) break; t -= diff / slope; } if (t < 0) t = 0; if (t > 1) t = 1; return cy(t); }; } const spinEase = easeSpline(.12, .86, .14, 1); let spinFrame = 0; let spinGuard = 0; function animateRotation(from, to, done) { cancelAnimationFrame(spinFrame); clearTimeout(spinGuard); let settled = false; const settle = () => { if (settled) return; settled = true; cancelAnimationFrame(spinFrame); clearTimeout(spinGuard); applyRotation(to); done(); }; if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) { settle(); return; } const started = performance.now(); const step = (now) => { const p = Math.min(1, (now - started) / SPIN_MS); applyRotation(from + (to - from) * spinEase(p)); if (p < 1) { spinFrame = requestAnimationFrame(step); } else { settle(); } }; spinFrame = requestAnimationFrame(step); spinGuard = setTimeout(settle, SPIN_MS + 1200); } function alignRotation(index) { const sliceStep = 360 / currentBatch.length; const desiredMod = ((-(index + .5) * sliceStep) % 360 + 360) % 360; const currentMod = ((currentRotation % 360) + 360) % 360; const delta = ((desiredMod - currentMod) % 360 + 360) % 360; return currentRotation + delta + 360 * (5 + Math.floor(Math.random() * 3)); } function setControlsDisabled(disabled) { spinning = disabled; spinBtn.disabled = disabled; shuffleBtn.disabled = disabled; pickBtn.disabled = disabled; document.body.classList.toggle("is-spinning", disabled); } function rotateTo(index, pickedName) { const target = currentBatch[index]; sliceNodes.forEach((node) => node.classList.remove("is-winner")); const from = currentRotation; const to = alignRotation(index); animateRotation(from, to, () => { setControlsDisabled(false); const winnerNode = sliceNodes[index]; if (winnerNode) winnerNode.classList.add("is-winner"); showRecipe(target); statusText.textContent = pickedName ? `已为你锁定“${target.name}”，菜谱在右侧。` : `今天就吃“${target.name}”！不满意可以再转一次。`; }); } function spin() { if (spinning || !currentBatch.length) return; setControlsDisabled(true); statusText.textContent = "正在认真替你挑菜……"; const index = Math.floor(Math.random() * currentBatch.length); rotateTo(index); } function spinToName(name) { if (spinning) return; const picked = recipes.find((recipe) => recipe.name === name); if (!picked) return; setControlsDisabled(true); statusText.textContent = `好的，这就为你转到“${picked.name}”……`; const others = shuffle(recipes.filter((recipe) => recipe.name !== name)); currentBatch = shuffle([picked, ...others.slice(0, 11)]); renderWheel(); const index = currentBatch.findIndex((recipe) => recipe.name === name); requestAnimationFrame(() => requestAnimationFrame(() => rotateTo(index, name))); } spinBtn.addEventListener("click", spin); shuffleBtn.addEventListener("click", () => { if (!spinning) refreshBatch(); }); function openPick() { if (spinning) return; pickSearch.value = ""; filterPick(""); pickModal.hidden = false; document.body.classList.add("modal-open"); pickSearch.focus(); } function closePick() { pickModal.hidden = true; document.body.classList.remove("modal-open"); } function filterPick(keyword) { const key = keyword.trim(); pickGrid.querySelectorAll(".pick-group").forEach((group) => { let visibleCount = 0; group.querySelectorAll(".pick-item").forEach((item) => { const matched = !key || item.dataset.name.includes(key); item.style.display = matched ? "" : "none"; if (matched) visibleCount += 1; }); group.style.display = visibleCount ? "" : "none"; }); } function buildPickList() { categories.filter((category) => category !== "全部").forEach((category) => { const group = document.createElement("div"); group.className = "pick-group"; const groupTitle = document.createElement("div"); groupTitle.className = "pick-group-title"; groupTitle.textContent = category; group.appendChild(groupTitle); recipes.filter((recipe) => recipe.category === category).forEach((recipe) => { const item = document.createElement("button"); item.type = "button"; item.className = "pick-item"; item.dataset.name = recipe.name; item.textContent = recipe.name; item.addEventListener("click", () => { closePick(); spinToName(recipe.name); }); group.appendChild(item); }); pickGrid.appendChild(group); }); } pickBtn.addEventListener("click", openPick); pickClose.addEventListener("click", closePick); pickModal.addEventListener("click", (event) => { if (event.target === pickModal) closePick(); }); pickSearch.addEventListener("input", () => filterPick(pickSearch.value)); window.addEventListener("keydown", (event) => { if (event.key === "Escape" && !pickModal.hidden) { event.preventDefault(); closePick(); } }); buildPickList(); window.addEventListener("keydown", (event) => { if (event.code === "Space" && !event.repeat) { event.preventDefault(); spin(); } }); createChips(); refreshBatch(); </script>

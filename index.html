body {

.slice-label {

function quantifyIngredient(item, name) {

  if (/所需主料/.test(item)) return `${name}主料 500克`;
  if (/\d/.test(item)) return item;
  if (/酱|醋|油|汁|水|浆|奶/.test(item)) return `${item} 15毫升`;
  if (/葱|姜|蒜|香菜|辣椒|花椒|芝麻|糖|盐|粉/.test(item)) return `${item} 8克`;
  return `${item} 200克`;
}

function preciseSeasonings(name) {
  if (/红烧|黄焖|卤/.test(name)) return ["生抽 20毫升", "老抽 5毫升", "料酒 15毫升", "冰糖 8克", "热水 400毫升"];
  if (/糖醋|锅包/.test(name)) return ["糖醋汁：白糖 30克、米醋 30毫升、生抽 10毫升、清水 30毫升", "淀粉 60克", "食用油 500毫升（实耗约40毫升）"];
  if (/炖|铁锅/.test(name)) return ["生抽 20毫升", "料酒 15毫升", "盐 4克", "热水 800毫升"];
  if (/凉拌|拉皮|苦菊|菠菜|面藕|腌萝卜/.test(name)) return ["凉拌汁：生抽 15毫升、香醋 20毫升、香油 5毫升、糖 3克、盐 2克", "蒜末 15克"];
  if (/蒸/.test(name)) return ["料酒 10毫升", "盐 2克", "蒸鱼豉油 15毫升", "热油 10毫升"];
  if (/汤/.test(name)) return ["清水或高汤 1000毫升", "盐 4克", "白胡椒粉 1克", "香油 3毫升"];
  if (/粥/.test(name)) return ["米与水比例 1:10（大米100克、清水1000毫升）", "盐 2克或糖 15克"];
  if (/奶昔/.test(name)) return ["水果 250克", "牛奶或酸奶 250毫升", "蜂蜜 10克"];
  if (/鲜榨.*汁|柠檬水/.test(name)) return ["水果 300克", "凉开水 200毫升", "蜂蜜或糖 10克"];
  if (/煎|炒|干煸|香锅/.test(name)) return ["食用油 20毫升", "生抽 10毫升", "盐 2克", "糖 2克"];
  return ["食用油 20毫升", "盐 3克", "生抽 10毫升"];
}

function getPreciseIngredients(name) {
  const base = getIngredients(name).map((item) => quantifyIngredient(item, name));
  return dedupe([...base, ...preciseSeasonings(name)]).slice(0, 10);
}
